<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Sky Hopper NYC</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030610;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 500px;
      max-height: 900px;
      overflow: hidden;
      background: #080d20;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.7);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      text-align: center;
    }

    #score {
      position: absolute;
      top: 28px;
      left: 0;
      width: 100%;
      color: white;
      font-size: 54px;
      font-weight: 900;
      text-shadow:
        3px 3px 0 #050505,
        -2px 2px 0 #050505,
        2px -2px 0 #050505;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      width: 86%;
      padding: 28px 22px;
      border-radius: 18px;
      background: rgba(5, 8, 20, 0.92);
      border: 1px solid rgba(255,255,255,0.14);
      color: white;
      box-shadow: 0 15px 45px rgba(0,0,0,0.55);
      pointer-events: auto;
    }

    #message h1 {
      margin: 0 0 12px;
      font-size: 40px;
    }

    #message p {
      margin: 8px 0;
      font-size: 17px;
      line-height: 1.5;
      color: #d9e1ff;
    }

    #startButton,
    #restartButton {
      margin-top: 17px;
      padding: 14px 34px;
      border: none;
      border-radius: 12px;
      background: #ffd447;
      color: #161616;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #a87e00;
    }

    #startButton:active,
    #restartButton:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #a87e00;
    }

    #gameOver {
      display: none;
    }

    #best {
      font-size: 16px;
      opacity: 0.8;
    }

    #hint {
      position: absolute;
      bottom: 17px;
      left: 0;
      width: 100%;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      text-shadow: 1px 1px 3px #000;
    }
  </style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="ui">

    <div id="score">0</div>

    <div id="message">

      <div id="startScreen">
        <h1>🌃 Sky Hopper NYC</h1>

        <p>Fly through the New York skyline!</p>

        <p>Tap, click, or press <b>SPACE</b> to fly.</p>

        <button id="startButton">START FLYING</button>
      </div>

      <div id="gameOver">

        <h1>💥 CRASH!</h1>

        <p>You flew through <b id="finalScore">0</b> buildings.</p>

        <p id="best">Best: 0</p>

        <button id="restartButton">FLY AGAIN</button>

      </div>

    </div>

    <div id="hint">
      TAP / CLICK / SPACE = FLY
    </div>

  </div>

</div>

<script>
(() => {

  "use strict";

  // ============================================================
  // CANVAS
  // ============================================================

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const game = document.getElementById("game");

  const scoreEl = document.getElementById("score");
  const message = document.getElementById("message");
  const startScreen = document.getElementById("startScreen");
  const gameOverScreen = document.getElementById("gameOver");
  const startButton = document.getElementById("startButton");
  const restartButton = document.getElementById("restartButton");
  const finalScore = document.getElementById("finalScore");
  const bestEl = document.getElementById("best");


  // ============================================================
  // GAME STATE
  // ============================================================

  let W = 400;
  let H = 700;

  let groundY = 620;

  let state = "ready";

  let score = 0;

  let best =
    Number(localStorage.getItem("skyHopperNYCBest")) || 0;

  let buildings = [];
  let particles = [];

  let backgroundStars = [];
  let distantBuildings = [];

  let lastTime = 0;
  let buildingTimer = 0;

  let skylineReady = false;


  // ============================================================
  // PLAYER
  // ============================================================

  const bird = {
    x: 100,
    y: 300,
    radius: 17,
    velocity: 0,
    rotation: 0
  };


  // ============================================================
  // PHYSICS
  // ============================================================

  const physics = {
    gravity: 1550,
    flap: -470,
    buildingSpeed: 190,
    buildingWidth: 76,
    gap: 185,
    spawnEvery: 1.45
  };


  // ============================================================
  // RESIZE
  // ============================================================

  function resize() {

    const rect = game.getBoundingClientRect();

    const dpr =
      Math.min(window.devicePixelRatio || 1, 2);

    W = rect.width;
    H = rect.height;

    canvas.width =
      Math.floor(W * dpr);

    canvas.height =
      Math.floor(H * dpr);

    canvas.style.width =
      W + "px";

    canvas.style.height =
      H + "px";

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    groundY =
      H - Math.max(65, H * 0.10);

    if (state === "ready") {
      bird.x = W * 0.25;
      bird.y = H * 0.45;
    }

    createBackground();

  }

  window.addEventListener("resize", resize);


  // ============================================================
  // SEEDED RANDOM NUMBER
  //
  // This is important:
  // Background details are generated once instead of using
  // Math.random() every frame. This prevents flashing.
  // ============================================================

  function seededRandom(seed) {

    let x =
      Math.sin(seed * 12.9898) *
      43758.5453;

    return x -
      Math.floor(x);

  }


  // ============================================================
  // CREATE STATIC BACKGROUND
  // ============================================================

  function createBackground() {

    backgroundStars = [];
    distantBuildings = [];

    // ----------------------------
    // STARS
    // ----------------------------

    const starCount =
      Math.floor(
        W * H / 7000
      );

    for (let i = 0; i < starCount; i++) {

      backgroundStars.push({

        x:
          seededRandom(i + 10) * W,

        y:
          seededRandom(i + 100) *
          groundY *
          0.70,

        size:
          0.5 +
          seededRandom(i + 200) * 1.5,

        brightness:
          0.35 +
          seededRandom(i + 300) * 0.5

      });

    }


    // ----------------------------
    // DISTANT SKYLINE
    // ----------------------------

    const buildingWidth = 45;

    let x = -10;

    let index = 0;

    while (x < W + 50) {

      const height =
        100 +
        seededRandom(index + 500) * 190;

      const width =
        30 +
        seededRandom(index + 600) * 25;

      const type =
        Math.floor(
          seededRandom(index + 700) * 4
        );

      const windows = [];

      const columns =
        Math.max(
          1,
          Math.floor(width / 13)
        );

      const rows =
        Math.max(
          2,
          Math.floor(height / 19)
        );

      for (
        let row = 0;
        row < rows;
        row++
      ) {

        for (
          let col = 0;
          col < columns;
          col++
        ) {

          const windowSeed =
            index * 1000 +
            row * 100 +
            col;

          const lit =
            seededRandom(
              windowSeed + 800
            ) > 0.42;

          if (lit) {

            windows.push({

              x: 7 + col * 13,

              y:
                10 +
                row * 19

            });

          }

        }

      }

      distantBuildings.push({

        x,
        width,
        height,
        type,
        windows

      });

      x +=
        buildingWidth +
        seededRandom(index + 900) * 8;

      index++;

    }

    skylineReady = true;

  }


  // ============================================================
  // RESET PLAYER
  // ============================================================

  function resetBird() {

    bird.x =
      W * 0.25;

    bird.y =
      H * 0.45;

    bird.velocity = 0;
    bird.rotation = 0;

  }


  // ============================================================
  // START GAME
  // ============================================================

  function startGame() {

    state = "playing";

    score = 0;

    buildings = [];
    particles = [];

    buildingTimer = 0;

    resetBird();

    scoreEl.textContent = "0";

    message.style.display = "none";

    flap();

  }


  // ============================================================
  // END GAME
  // ============================================================

  function endGame() {

    if (state !== "playing")
      return;

    state = "gameover";

    finalScore.textContent =
      score;

    if (score > best) {

      best = score;

      localStorage.setItem(
        "skyHopperNYCBest",
        best
      );

    }

    bestEl.textContent =
      "Best: " + best;

    message.style.display =
      "block";

    startScreen.style.display =
      "none";

    gameOverScreen.style.display =
      "block";

    createParticles(
      bird.x,
      bird.y,
      24
    );

  }


  // ============================================================
  // FLAP
  // ============================================================

  function flap() {

    if (state !== "playing")
      return;

    bird.velocity =
      physics.flap;

    createParticles(
      bird.x - 18,
      bird.y + 6,
      4
    );

  }


  // ============================================================
  // INPUT
  // ============================================================

  function handleInput(e) {

    if (e) {
      e.preventDefault();
    }

    if (state === "ready") {
      startGame();
      return;
    }

    if (state === "gameover") {
      startGame();
      return;
    }

    flap();

  }


  window.addEventListener(
    "keydown",
    e => {

      if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
      ) {

        handleInput(e);

      }

    }
  );


  canvas.addEventListener(
    "pointerdown",
    handleInput
  );


  startButton.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      startGame();

    }
  );


  restartButton.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      startGame();

    }
  );


  // ============================================================
  // CREATE BUILDING OBSTACLE
  // ============================================================

  function spawnBuildingPair() {

    const minTop = 85;

    const maxTop =
      groundY -
      physics.gap -
      95;

    const topHeight =
      minTop +
      Math.random() *
      Math.max(
        35,
        maxTop - minTop
      );

    const styles = [
      "office",
      "brick",
      "glass",
      "old",
      "modern"
    ];

    const style =
      styles[
        Math.floor(
          Math.random() *
          styles.length
        )
      ];


    // Each obstacle gets its own static
    // window layout.

    const topWindows =
      createBuildingWindows(
        physics.buildingWidth,
        topHeight,
        style,
        Math.floor(
          Math.random() * 100000
        )
      );

    const bottomHeight =
      groundY -
      (topHeight + physics.gap);

    const bottomWindows =
      createBuildingWindows(
        physics.buildingWidth,
        bottomHeight,
        style,
        Math.floor(
          Math.random() * 100000
        )
      );


    buildings.push({

      x:
        W + physics.buildingWidth,

      top:
        topHeight,

      gap:
        physics.gap,

      style,

      topWindows,

      bottomWindows,

      counted: false

    });

  }


  // ============================================================
  // STATIC BUILDING WINDOWS
  // ============================================================

  function createBuildingWindows(
    width,
    height,
    style,
    seed
  ) {

    const windows = [];

    if (height < 45)
      return windows;


    const columns =
      Math.max(
        2,
        Math.floor(width / 15)
      );

    const rows =
      Math.floor(
        (height - 18) / 18
      );


    for (
      let row = 0;
      row < rows;
      row++
    ) {

      for (
        let col = 0;
        col < columns;
        col++
      ) {

        const value =
          seededRandom(
            seed +
            row * 137 +
            col * 31
          );


        // Some buildings have darker
        // windows than others.

        let threshold = 0.35;

        if (style === "old")
          threshold = 0.48;

        if (style === "glass")
          threshold = 0.22;


        if (value > threshold) {

          windows.push({

            x:
              7 +
              col * 14,

            y:
              10 +
              row * 18,

            brightness:
              0.60 +
              seededRandom(
                seed +
                row * 71 +
                col * 17 +
                5000
              ) * 0.35,

            warm:
              seededRandom(
                seed +
                row * 91 +
                col * 23 +
                9000
              ) > 0.35

          });

        }

      }

    }

    return windows;

  }


  // ============================================================
  // UPDATE
  // ============================================================

  function update(dt) {

    if (state !== "playing") {

      updateParticles(dt);

      return;

    }


    // Player

    bird.velocity +=
      physics.gravity * dt;

    bird.y +=
      bird.velocity * dt;

    bird.rotation =
      Math.min(
        Math.PI / 2,
        Math.max(
          -0.5,
          bird.velocity / 600
        )
      );


    // Building spawning

    buildingTimer += dt;

    if (
      buildingTimer >=
      physics.spawnEvery
    ) {

      buildingTimer = 0;

      spawnBuildingPair();

    }


    // Move buildings

    for (const building of buildings) {

      building.x -=
        physics.buildingSpeed * dt;


      if (
        !building.counted &&
        building.x +
        physics.buildingWidth <
        bird.x
      ) {

        building.counted = true;

        score++;

        scoreEl.textContent =
          score;

        createParticles(
          bird.x,
          bird.y,
          6
        );

      }

    }


    buildings =
      buildings.filter(
        building =>
          building.x +
          physics.buildingWidth >
          -40
      );


    checkCollisions();

    updateParticles(dt);

  }


  // ============================================================
  // COLLISION
  // ============================================================

  function checkCollisions() {

    if (
      bird.y -
      bird.radius <=
      0
    ) {

      endGame();

      return;

    }


    if (
      bird.y +
      bird.radius >=
      groundY
    ) {

      endGame();

      return;

    }


    for (const building of buildings) {

      const left =
        building.x;

      const right =
        building.x +
        physics.buildingWidth;

      const topBottom =
        building.top;

      const bottomTop =
        building.top +
        building.gap;


      const birdLeft =
        bird.x -
        bird.radius *
        0.75;

      const birdRight =
        bird.x +
        bird.radius *
        0.75;

      const birdTop =
        bird.y -
        bird.radius *
        0.75;

      const birdBottom =
        bird.y +
        bird.radius *
        0.75;


      const horizontal =
        birdRight > left &&
        birdLeft < right;

      const vertical =
        birdTop < topBottom ||
        birdBottom > bottomTop;


      if (
        horizontal &&
        vertical
      ) {

        endGame();

        return;

      }

    }

  }


  // ============================================================
  // PARTICLES
  // ============================================================

  function createParticles(
    x,
    y,
    amount
  ) {

    for (
      let i = 0;
      i < amount;
      i++
    ) {

      particles.push({

        x,

        y,

        vx:
          -35 -
          Math.random() * 75,

        vy:
          (Math.random() - 0.5) *
          100,

        life:
          0.35 +
          Math.random() *
          0.35,

        maxLife:
          0.7,

        size:
          2 +
          Math.random() * 3

      });

    }

  }


  function updateParticles(dt) {

    for (const p of particles) {

      p.life -= dt;

      p.x +=
        p.vx * dt;

      p.y +=
        p.vy * dt;

      p.vy +=
        200 * dt;

    }


    particles =
      particles.filter(
        p => p.life > 0
      );

  }


  // ============================================================
  // DRAW EVERYTHING
  // ============================================================

  function draw() {

    drawNightSky();

    drawStars();

    drawMoon();

    drawDistantCity();

    drawMainBuildings();

    drawParticles();

    drawPlayer();

    drawGround();

  }


  // ============================================================
  // SKY
  // ============================================================

  function drawNightSky() {

    const gradient =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );

    gradient.addColorStop(
      0,
      "#020615"
    );

    gradient.addColorStop(
      0.45,
      "#09152f"
    );

    gradient.addColorStop(
      1,
      "#142844"
    );

    ctx.fillStyle =
      gradient;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  // ============================================================
  // STARS
  // ============================================================

  function drawStars() {

    for (
      const star
      of backgroundStars
    ) {

      ctx.globalAlpha =
        star.brightness;

      ctx.fillStyle =
        "#ffffff";

      ctx.beginPath();

      ctx.arc(
        star.x,
        star.y,
        star.size,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

    ctx.globalAlpha = 1;

  }


  // ============================================================
  // MOON
  // ============================================================

  function drawMoon() {

    const moonX =
      W * 0.78;

    const moonY =
      H * 0.16;

    const radius =
      Math.min(
        42,
        W * 0.095
      );


    // Soft glow

    const glow =
      ctx.createRadialGradient(
        moonX,
        moonY,
        4,
        moonX,
        moonY,
        radius * 2.7
      );

    glow.addColorStop(
      0,
      "rgba(255,245,190,0.22)"
    );

    glow.addColorStop(
      1,
      "rgba(255,245,190,0)"
    );

    ctx.fillStyle =
      glow;

    ctx.beginPath();

    ctx.arc(
      moonX,
      moonY,
      radius * 2.7,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // Moon

    ctx.fillStyle =
      "#fff3c4";

    ctx.beginPath();

    ctx.arc(
      moonX,
      moonY,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // Crescent shadow

    ctx.fillStyle =
      "#09152f";

    ctx.beginPath();

    ctx.arc(
      moonX + radius * 0.34,
      moonY - radius * 0.18,
      radius * 0.88,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  // ============================================================
  // DISTANT CITY
  // ============================================================

  function drawDistantCity() {

    if (!skylineReady)
      return;


    const base =
      groundY - 30;


    // Far skyline

    for (
      const building
      of distantBuildings
    ) {

      ctx.fillStyle =
        "#080f1d";

      ctx.fillRect(
        building.x,
        base - building.height,
        building.width,
        building.height
      );


      // Static windows

      for (
        const win
        of building.windows
      ) {

        if (
          win.x + 4 >
          building.width
        )
          continue;

        if (
          win.y + 7 >
          building.height
        )
          continue;


        ctx.fillStyle =
          "rgba(255,204,92,0.48)";

        ctx.fillRect(
          building.x + win.x,
          base -
            building.height +
            win.y,
          4,
          7
        );

      }

    }


    // ---------------------------------
    // Empire-State-Building-style tower
    // ---------------------------------

    const center =
      W * 0.48;

    const towerBase =
      base;

    ctx.fillStyle =
      "#050a14";


    ctx.fillRect(
      center - 30,
      towerBase - 185,
      60,
      185
    );


    ctx.fillRect(
      center - 21,
      towerBase - 245,
      42,
      60
    );


    ctx.fillRect(
      center - 11,
      towerBase - 290,
      22,
      45
    );


    // Spire

    ctx.fillRect(
      center - 2,
      towerBase - 320,
      4,
      30
    );


    // Static tower windows

    ctx.fillStyle =
      "rgba(255,205,100,0.42)";


    for (
      let row = 0;
      row < 7;
      row++
    ) {

      for (
        let col = 0;
        col < 4;
        col++
      ) {

        if (
          (row + col) % 3 !== 0
        ) {

          ctx.fillRect(
            center -
            22 +
            col * 14,
            towerBase -
            168 +
            row * 20,
            5,
            8
          );

        }

      }

    }

  }


  // ============================================================
  // MAIN BUILDINGS
  // ============================================================

  function drawMainBuildings() {

    for (
      const building
      of buildings
    ) {

      drawCityBuilding(
        building.x,
        0,
        physics.buildingWidth,
        building.top,
        building.style,
        building.topWindows,
        true
      );


      drawCityBuilding(
        building.x,
        building.top +
        building.gap,
        physics.buildingWidth,
        groundY -
        (
          building.top +
          building.gap
        ),
        building.style,
        building.bottomWindows,
        false
      );

    }

  }


  // ============================================================
  // CITY BUILDING
  // ============================================================

  function drawCityBuilding(
    x,
    y,
    width,
    height,
    style,
    windows,
    topBuilding
  ) {

    if (height <= 0)
      return;


    let body =
      "#222b3d";

    let edge =
      "#111827";


    if (style === "brick") {

      body =
        "#493039";

      edge =
        "#2a1c23";

    }


    if (style === "glass") {

      body =
        "#183b50";

      edge =
        "#102632";

    }


    if (style === "old") {

      body =
        "#37343d";

      edge =
        "#24212a";

    }


    if (style === "modern") {

      body =
        "#29384b";

      edge =
        "#151f30";

    }


    // Main body

    ctx.fillStyle =
      body;

    ctx.fillRect(
      x,
      y,
      width,
      height
    );


    // Side edge

    ctx.fillStyle =
      edge;

    ctx.fillRect(
      x + width - 7,
      y,
      7,
      height
    );


    // Roof

    ctx.fillStyle =
      "#0b111e";

    if (topBuilding) {

      ctx.fillRect(
        x - 3,
        height - 7,
        width + 6,
        7
      );

    } else {

      ctx.fillRect(
        x - 3,
        y,
        width + 6,
        7
      );

    }


    // ---------------------------------
    // Windows
    // ---------------------------------

    for (
      const win
      of windows
    ) {

      if (
        win.x + 6 >
        width - 5
      )
        continue;

      if (
        win.y + 9 >
        height - 5
      )
        continue;


      const color =
        win.warm
          ? "rgba(255,211,103,"
          : "rgba(177,214,255,";


      ctx.fillStyle =
        color +
        win.brightness +
        ")";


      let drawY;

      if (topBuilding) {

        drawY =
          height -
          win.y -
          9;

      } else {

        drawY =
          y +
          win.y;

      }


      ctx.fillRect(
        x + win.x,
        drawY,
        6,
        9
      );

    }


    // ---------------------------------
    // Rooftop water tower
    // ---------------------------------

    if (
      height > 180 &&
      Math.floor(x) % 3 === 0
    ) {

      let towerY;

      if (topBuilding) {

        towerY =
          height - 29;

      } else {

        towerY =
          y + 28;

      }


      ctx.fillStyle =
        "#13151b";

      ctx.fillRect(
        x + width / 2 - 9,
        towerY - 19,
        18,
        19
      );


      ctx.fillStyle =
        "#0b0d12";

      ctx.fillRect(
        x + width / 2 - 13,
        towerY - 22,
        26,
        4
      );

    }

  }


  // ============================================================
  // PLAYER
  // ============================================================

  function drawPlayer() {

    ctx.save();

    ctx.translate(
      bird.x,
      bird.y
    );

    ctx.rotate(
      bird.rotation
    );


    // Jet flame

    ctx.fillStyle =
      "#ff9418";

    ctx.beginPath();

    ctx.moveTo(-17, 6);
    ctx.lineTo(-34, 12);
    ctx.lineTo(-19, 18);
    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
      "#ffe047";

    ctx.beginPath();

    ctx.moveTo(-18, 8);
    ctx.lineTo(-29, 12);
    ctx.lineTo(-19, 14);
    ctx.closePath();

    ctx.fill();


    // Body

    ctx.fillStyle =
      "#ffd83d";

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      20,
      16,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.strokeStyle =
      "#9b7200";

    ctx.lineWidth = 2;

    ctx.stroke();


    // Wing

    ctx.fillStyle =
      "#e8af22";

    ctx.beginPath();

    ctx.ellipse(
      -6,
      6,
      12,
      7,
      -0.3,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // Eye

    ctx.fillStyle =
      "#ffffff";

    ctx.beginPath();

    ctx.arc(
      9,
      -7,
      6,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#151515";

    ctx.beginPath();

    ctx.arc(
      11,
      -7,
      2.7,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // Beak

    ctx.fillStyle =
      "#f28c28";

    ctx.beginPath();

    ctx.moveTo(17, -1);
    ctx.lineTo(31, 4);
    ctx.lineTo(17, 9);
    ctx.closePath();

    ctx.fill();


    ctx.strokeStyle =
      "#9b4e00";

    ctx.lineWidth = 1.5;

    ctx.stroke();


    ctx.restore();

  }


  // ============================================================
  // GROUND / STREET
  // ============================================================

  function drawGround() {

    // Street

    ctx.fillStyle =
      "#090d15";

    ctx.fillRect(
      0,
      groundY,
      W,
      H - groundY
    );


    // Sidewalk

    ctx.fillStyle =
      "#292d36";

    ctx.fillRect(
      0,
      groundY,
      W,
      12
    );


    // Sidewalk seams

    ctx.strokeStyle =
      "#444953";

    ctx.lineWidth = 2;


    for (
      let x = -20;
      x < W + 40;
      x += 40
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x,
        groundY
      );

      ctx.lineTo(
        x - 15,
        H
      );

      ctx.stroke();

    }


    // Road stripe

    ctx.fillStyle =
      "#1b2029";

    ctx.fillRect(
      0,
      groundY + 35,
      W,
      5
    );


    // Distant yellow lights

    ctx.fillStyle =
      "#dcb72e";

    for (
      let x = 20;
      x < W;
      x += 100
    ) {

      ctx.fillRect(
        x,
        groundY + 53,
        20,
        4
      );

    }

  }


  // ============================================================
  // PARTICLES
  // ============================================================

  function drawParticles() {

    for (
      const p
      of particles
    ) {

      ctx.globalAlpha =
        Math.max(
          0,
          p.life / p.maxLife
        );

      ctx.fillStyle =
        "#ffffff";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

    ctx.globalAlpha = 1;

  }


  // ============================================================
  // MAIN LOOP
  // ============================================================

  function loop(timestamp) {

    if (!lastTime)
      lastTime = timestamp;


    let dt =
      (timestamp - lastTime) /
      1000;


    // Prevent huge physics jumps
    // when the browser pauses the game.

    dt =
      Math.min(
        dt,
        0.035
      );


    lastTime =
      timestamp;


    update(dt);

    draw();


    requestAnimationFrame(loop);

  }


  // ============================================================
  // INITIALIZE
  // ============================================================

  resize();

  bestEl.textContent =
    "Best: " + best;

  requestAnimationFrame(loop);

})();
</script>

</body>
