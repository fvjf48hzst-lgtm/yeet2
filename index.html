<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Sky Hopper NYC</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030610;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 500px;
      max-height: 900px;
      overflow: hidden;
      background: #080d20;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.7);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      text-align: center;
    }

    #score {
      position: absolute;
      top: 28px;
      left: 0;
      width: 100%;
      color: white;
      font-size: 54px;
      font-weight: 900;
      text-shadow:
        3px 3px 0 #050505,
        -2px 2px 0 #050505,
        2px -2px 0 #050505;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 43%;
      transform: translate(-50%, -50%);
      width: 86%;
      padding: 28px 22px;
      border-radius: 18px;
      background: rgba(5, 8, 20, 0.92);
      border: 1px solid rgba(255,255,255,0.14);
      color: white;
      box-shadow: 0 15px 45px rgba(0,0,0,0.55);
      pointer-events: auto;
    }

    #message h1 {
      margin: 0 0 12px;
      font-size: 40px;
    }

    #message p {
      margin: 8px 0;
      font-size: 17px;
      line-height: 1.5;
      color: #d9e1ff;
    }

    #startButton,
    #restartButton {
      margin-top: 17px;
      padding: 14px 34px;
      border: none;
      border-radius: 12px;
      background: #ffd447;
      color: #161616;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #a87e00;
    }

    #startButton:active,
    #restartButton:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #a87e00;
    }

    #gameOver {
      display: none;
    }

    #best {
      font-size: 16px;
      opacity: 0.8;
    }

    #hint {
      position: absolute;
      bottom: 17px;
      left: 0;
      width: 100%;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      text-shadow: 1px 1px 3px #000;
    }
  </style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="ui">

    <div id="score">0</div>

    <div id="message">

      <div id="startScreen">
        <h1>🌃 Sky Hopper NYC</h1>

        <p>Fly through the New York skyline!</p>

        <p>Tap, click, or press <b>SPACE</b> to fly.</p>

        <button id="startButton">START FLYING</button>
      </div>

      <div id="gameOver">

        <h1>💥 CRASH!</h1>

        <p>You flew through <b id="finalScore">0</b> buildings.</p>

        <p id="best">Best: 0</p>

        <button id="restartButton">FLY AGAIN</button>

      </div>

    </div>

    <div id="hint">
      TAP / CLICK / SPACE = FLY
    </div>

  </div>

</div>

<script>
(() => {

  "use strict";

  // ============================================================
  // CANVAS
  // ============================================================

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const game = document.getElementById("game");

  const scoreEl = document.getElementById("score");
  const message = document.getElementById("message");
  const startScreen = document.getElementById("startScreen");
  const gameOverScreen = document.getElementById("gameOver");
  const startButton = document.getElementById("startButton");
  const restartButton = document.getElementById("restartButton");
  const finalScore = document.getElementById("finalScore");
  const bestEl = document.getElementById("best");


  // ============================================================
  // GAME STATE
  // ============================================================

  let W = 400;
  let H = 700;
  let groundY = 620;

  let state = "ready";
  let score = 0;

  let best =
    Number(localStorage.getItem("skyHopperNYCBest")) || 0;

  let buildings = [];
  let particles = [];

  let backgroundStars = [];
  let distantBuildings = [];

  let lastTime = 0;
  let buildingTimer = 0;
  let skylineReady = false;


  // ============================================================
  // ARMORED HERO
  //
  // The character flies horizontally, facing forward.
  // The body itself is drawn at a fixed horizontal angle.
  // ============================================================

  const hero = {

    x: 100,

    y: 300,

    radius: 19,

    velocity: 0,

    rotation: 0,

    flameTime: 0

  };


  // ============================================================
  // PHYSICS
  // ============================================================

  const physics = {

    gravity: 1550,

    flap: -470,

    buildingSpeed: 190,

    buildingWidth: 76,

    gap: 185,

    spawnEvery: 1.45

  };


  // ============================================================
  // RESIZE
  // ============================================================

  function resize() {

    const rect =
      game.getBoundingClientRect();

    const dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    W = rect.width;
    H = rect.height;

    canvas.width =
      Math.floor(W * dpr);

    canvas.height =
      Math.floor(H * dpr);

    canvas.style.width =
      W + "px";

    canvas.style.height =
      H + "px";

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    groundY =
      H - Math.max(
        65,
        H * 0.10
      );

    if (state === "ready") {

      hero.x =
        W * 0.25;

      hero.y =
        H * 0.45;

    }

    createBackground();

  }

  window.addEventListener(
    "resize",
    resize
  );


  // ============================================================
  // SEEDED RANDOM
  // ============================================================

  function seededRandom(seed) {

    let x =
      Math.sin(seed * 12.9898) *
      43758.5453;

    return x -
      Math.floor(x);

  }


  // ============================================================
  // STATIC BACKGROUND
  // ============================================================

  function createBackground() {

    backgroundStars = [];
    distantBuildings = [];

    // Stars

    const starCount =
      Math.floor(
        W * H / 7000
      );

    for (
      let i = 0;
      i < starCount;
      i++
    ) {

      backgroundStars.push({

        x:
          seededRandom(i + 10) *
          W,

        y:
          seededRandom(i + 100) *
          groundY *
          0.70,

        size:
          0.5 +
          seededRandom(i + 200) *
          1.5,

        brightness:
          0.35 +
          seededRandom(i + 300) *
          0.5

      });

    }


    // Distant buildings

    const buildingWidth = 45;

    let x = -10;
    let index = 0;

    while (x < W + 50) {

      const height =
        100 +
        seededRandom(index + 500) *
        190;

      const width =
        30 +
        seededRandom(index + 600) *
        25;

      const type =
        Math.floor(
          seededRandom(index + 700) * 4
        );

      const windows = [];

      const columns =
        Math.max(
          1,
          Math.floor(width / 13)
        );

      const rows =
        Math.max(
          2,
          Math.floor(height / 19)
        );

      for (
        let row = 0;
        row < rows;
        row++
      ) {

        for (
          let col = 0;
          col < columns;
          col++
        ) {

          const windowSeed =
            index * 1000 +
            row * 100 +
            col;

          if (
            seededRandom(
              windowSeed + 800
            ) > 0.42
          ) {

            windows.push({

              x:
                7 +
                col * 13,

              y:
                10 +
                row * 19

            });

          }

        }

      }

      distantBuildings.push({

        x,
        width,
        height,
        type,
        windows

      });

      x +=
        buildingWidth +
        seededRandom(index + 900) * 8;

      index++;

    }

    skylineReady = true;

  }


  // ============================================================
  // RESET HERO
  // ============================================================

  function resetHero() {

    hero.x =
      W * 0.25;

    hero.y =
      H * 0.45;

    hero.velocity = 0;

    hero.rotation = 0;

    hero.flameTime = 0;

  }


  // ============================================================
  // START
  // ============================================================

  function startGame() {

    state = "playing";

    score = 0;

    buildings = [];
    particles = [];

    buildingTimer = 0;

    resetHero();

    scoreEl.textContent = "0";

    message.style.display = "none";

    flap();

  }


  // ============================================================
  // GAME OVER
  // ============================================================

  function endGame() {

    if (state !== "playing")
      return;

    state = "gameover";

    finalScore.textContent =
      score;

    if (score > best) {

      best = score;

      localStorage.setItem(
        "skyHopperNYCBest",
        best
      );

    }

    bestEl.textContent =
      "Best: " + best;

    message.style.display =
      "block";

    startScreen.style.display =
      "none";

    gameOverScreen.style.display =
      "block";

    createParticles(
      hero.x,
      hero.y,
      24
    );

  }


  // ============================================================
  // FLAP / BOOST
  // ============================================================

  function flap() {

    if (state !== "playing")
      return;

    hero.velocity =
      physics.flap;

    createParticles(
      hero.x - 20,
      hero.y + 8,
      4
    );

  }


  // ============================================================
  // INPUT
  // ============================================================

  function handleInput(e) {

    if (e)
      e.preventDefault();

    if (state === "ready") {

      startGame();

      return;

    }

    if (state === "gameover") {

      startGame();

      return;

    }

    flap();

  }


  window.addEventListener(
    "keydown",
    e => {

      if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
      ) {

        handleInput(e);

      }

    }
  );


  canvas.addEventListener(
    "pointerdown",
    handleInput
  );


  startButton.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      startGame();

    }
  );


  restartButton.addEventListener(
    "click",
    e => {

      e.stopPropagation();

      startGame();

    }
  );


  // ============================================================
  // BUILDING WINDOWS
  // ============================================================

  function createBuildingWindows(
    width,
    height,
    style,
    seed
  ) {

    const windows = [];

    if (height < 45)
      return windows;

    const columns =
      Math.max(
        2,
        Math.floor(width / 15)
      );

    const rows =
      Math.floor(
        (height - 18) / 18
      );

    for (
      let row = 0;
      row < rows;
      row++
    ) {

      for (
        let col = 0;
        col < columns;
        col++
      ) {

        const value =
          seededRandom(
            seed +
            row * 137 +
            col * 31
          );

        let threshold = 0.35;

        if (style === "old")
          threshold = 0.48;

        if (style === "glass")
          threshold = 0.22;

        if (value > threshold) {

          windows.push({

            x:
              7 +
              col * 14,

            y:
              10 +
              row * 18,

            brightness:
              0.60 +
              seededRandom(
                seed +
                row * 71 +
                col * 17 +
                5000
              ) * 0.35,

            warm:
              seededRandom(
                seed +
                row * 91 +
                col * 23 +
                9000
              ) > 0.35

          });

        }

      }

    }

    return windows;

  }


  // ============================================================
  // SPAWN BUILDING PAIR
  // ============================================================

  function spawnBuildingPair() {

    const minTop = 85;

    const maxTop =
      groundY -
      physics.gap -
      95;

    const topHeight =
      minTop +
      Math.random() *
      Math.max(
        35,
        maxTop - minTop
      );

    const styles = [
      "office",
      "brick",
      "glass",
      "old",
      "modern"
    ];

    const style =
      styles[
        Math.floor(
          Math.random() *
          styles.length
        )
      ];


    const topSeed =
      Math.floor(
        Math.random() *
        1000000
      );

    const bottomSeed =
      Math.floor(
        Math.random() *
        1000000
      );


    const topWindows =
      createBuildingWindows(
        physics.buildingWidth,
        topHeight,
        style,
        topSeed
      );


    const bottomHeight =
      groundY -
      (
        topHeight +
        physics.gap
      );


    const bottomWindows =
      createBuildingWindows(
        physics.buildingWidth,
        bottomHeight,
        style,
        bottomSeed
      );


    buildings.push({

      x:
        W +
        physics.buildingWidth,

      top:
        topHeight,

      gap:
        physics.gap,

      style,

      topWindows,

      bottomWindows,

      counted: false

    });

  }


  // ============================================================
  // UPDATE
  // ============================================================

  function update(dt) {

    if (state !== "playing") {

      updateParticles(dt);

      return;

    }


    // Gravity

    hero.velocity +=
      physics.gravity * dt;

    hero.y +=
      hero.velocity * dt;


    // Small rotation based on movement,
    // but the character remains essentially
    // horizontal.

    hero.rotation =
      Math.min(
        0.20,
        Math.max(
          -0.20,
          hero.velocity / 2800
        )
      );


    hero.flameTime += dt;


    // Building timer

    buildingTimer += dt;

    if (
      buildingTimer >=
      physics.spawnEvery
    ) {

      buildingTimer = 0;

      spawnBuildingPair();

    }


    // Buildings

    for (
      const building
      of buildings
    ) {

      building.x -=
        physics.buildingSpeed * dt;


      if (
        !building.counted &&
        building.x +
        physics.buildingWidth <
        hero.x
      ) {

        building.counted = true;

        score++;

        scoreEl.textContent =
          score;

        createParticles(
          hero.x,
          hero.y,
          6
        );

      }

    }


    buildings =
      buildings.filter(
        building =>
          building.x +
          physics.buildingWidth >
          -40
      );


    checkCollisions();

    updateParticles(dt);

  }


  // ============================================================
  // COLLISION
  // ============================================================

  function checkCollisions() {

    if (
      hero.y -
      hero.radius <=
      0
    ) {

      endGame();

      return;

    }


    if (
      hero.y +
      hero.radius >=
      groundY
    ) {

      endGame();

      return;

    }


    for (
      const building
      of buildings
    ) {

      const left =
        building.x;

      const right =
        building.x +
        physics.buildingWidth;

      const topBottom =
        building.top;

      const bottomTop =
        building.top +
        building.gap;


      const heroLeft =
        hero.x -
        hero.radius *
        0.85;

      const heroRight =
        hero.x +
        hero.radius *
        0.85;

      const heroTop =
        hero.y -
        hero.radius *
        0.80;

      const heroBottom =
        hero.y +
        hero.radius *
        0.80;


      const horizontal =
        heroRight > left &&
        heroLeft < right;

      const vertical =
        heroTop < topBottom ||
        heroBottom > bottomTop;


      if (
        horizontal &&
        vertical
      ) {

        endGame();

        return;

      }

    }

  }


  // ============================================================
  // PARTICLES
  // ============================================================

  function createParticles(
    x,
    y,
    amount
  ) {

    for (
      let i = 0;
      i < amount;
      i++
    ) {

      particles.push({

        x,

        y,

        vx:
          -35 -
          Math.random() * 75,

        vy:
          (Math.random() - 0.5) *
          100,

        life:
          0.35 +
          Math.random() *
          0.35,

        maxLife:
          0.7,

        size:
          2 +
          Math.random() *
          3

      });

    }

  }


  function updateParticles(dt) {

    for (
      const p
      of particles
    ) {

      p.life -= dt;

      p.x +=
        p.vx * dt;

      p.y +=
        p.vy * dt;

      p.vy +=
        200 * dt;

    }


    particles =
      particles.filter(
        p => p.life > 0
      );

  }


  // ============================================================
  // DRAW
  // ============================================================

  function draw() {

    drawNightSky();

    drawStars();

    drawMoon();

    drawDistantCity();

    drawMainBuildings();

    drawParticles();

    drawHero();

    drawGround();

  }


  // ============================================================
  // NIGHT SKY
  // ============================================================

  function drawNightSky() {

    const gradient =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );

    gradient.addColorStop(
      0,
      "#020615"
    );

    gradient.addColorStop(
      0.45,
      "#09152f"
    );

    gradient.addColorStop(
      1,
      "#142844"
    );

    ctx.fillStyle =
      gradient;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  // ============================================================
  // STARS
  // ============================================================

  function drawStars() {

    for (
      const star
      of backgroundStars
    ) {

      ctx.globalAlpha =
        star.brightness;

      ctx.fillStyle =
        "#ffffff";

      ctx.beginPath();

      ctx.arc(
        star.x,
        star.y,
        star.size,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

    ctx.globalAlpha = 1;

  }


  // ============================================================
  // MOON
  // ============================================================

  function drawMoon() {

    const moonX =
      W * 0.78;

    const moonY =
      H * 0.16;

    const radius =
      Math.min(
        42,
        W * 0.095
      );


    const glow =
      ctx.createRadialGradient(
        moonX,
        moonY,
        4,
        moonX,
        moonY,
        radius * 2.7
      );

    glow.addColorStop(
      0,
      "rgba(255,245,190,0.22)"
    );

    glow.addColorStop(
      1,
      "rgba(255,245,190,0)"
    );

    ctx.fillStyle =
      glow;

    ctx.beginPath();

    ctx.arc(
      moonX,
      moonY,
      radius * 2.7,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#fff3c4";

    ctx.beginPath();

    ctx.arc(
      moonX,
      moonY,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#09152f";

    ctx.beginPath();

    ctx.arc(
      moonX + radius * 0.34,
      moonY - radius * 0.18,
      radius * 0.88,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  // ============================================================
  // DISTANT NYC SKYLINE
  // ============================================================

  function drawDistantCity() {

    if (!skylineReady)
      return;


    const base =
      groundY - 30;


    for (
      const building
      of distantBuildings
    ) {

      ctx.fillStyle =
        "#080f1d";

      ctx.fillRect(
        building.x,
        base - building.height,
        building.width,
        building.height
      );


      for (
        const win
        of building.windows
      ) {

        if (
          win.x + 4 >
          building.width
        )
          continue;

        if (
          win.y + 7 >
          building.height
        )
          continue;


        ctx.fillStyle =
          "rgba(255,204,92,0.48)";

        ctx.fillRect(
          building.x + win.x,
          base -
          building.height +
          win.y,
          4,
          7
        );

      }

    }


    // Empire-State-Building-inspired silhouette

    const center =
      W * 0.48;

    const towerBase =
      base;


    ctx.fillStyle =
      "#050a14";


    ctx.fillRect(
      center - 30,
      towerBase - 185,
      60,
      185
    );


    ctx.fillRect(
      center - 21,
      towerBase - 245,
      42,
      60
    );


    ctx.fillRect(
      center - 11,
      towerBase - 290,
      22,
      45
    );


    ctx.fillRect(
      center - 2,
      towerBase - 320,
      4,
      30
    );


    ctx.fillStyle =
      "rgba(255,205,100,0.42)";


    for (
      let row = 0;
      row < 7;
      row++
    ) {

      for (
        let col = 0;
        col < 4;
        col++
      ) {

        if (
          (row + col) % 3 !== 0
        ) {

          ctx.fillRect(
            center -
            22 +
            col * 14,
            towerBase -
            168 +
            row * 20,
            5,
            8
          );

        }

      }

    }

  }


  // ============================================================
  // MAIN BUILDINGS
  // ============================================================

  function drawMainBuildings() {

    for (
      const building
      of buildings
    ) {

      drawCityBuilding(
        building.x,
        0,
        physics.buildingWidth,
        building.top,
        building.style,
        building.topWindows,
        true
      );


      drawCityBuilding(
        building.x,
        building.top +
        building.gap,
        physics.buildingWidth,
        groundY -
        (
          building.top +
          building.gap
        ),
        building.style,
        building.bottomWindows,
        false
      );

    }

  }


  // ============================================================
  // BUILDING
  // ============================================================

  function drawCityBuilding(
    x,
    y,
    width,
    height,
    style,
    windows,
    topBuilding
  ) {

    if (height <= 0)
      return;


    let body =
      "#222b3d";

    let edge =
      "#111827";


    if (style === "brick") {

      body =
        "#493039";

      edge =
        "#2a1c23";

    }


    if (style === "glass") {

      body =
        "#183b50";

      edge =
        "#102632";

    }


    if (style === "old") {

      body =
        "#37343d";

      edge =
        "#24212a";

    }


    if (style === "modern") {

      body =
        "#29384b";

      edge =
        "#151f30";

    }


    ctx.fillStyle =
      body;

    ctx.fillRect(
      x,
      y,
      width,
      height
    );


    ctx.fillStyle =
      edge;

    ctx.fillRect(
      x + width - 7,
      y,
      7,
      height
    );


    ctx.fillStyle =
      "#0b111e";


    if (topBuilding) {

      ctx.fillRect(
        x - 3,
        height - 7,
        width + 6,
        7
      );

    } else {

      ctx.fillRect(
        x - 3,
        y,
        width + 6,
        7
      );

    }


    // STATIC WINDOWS

    for (
      const win
      of windows
    ) {

      if (
        win.x + 6 >
        width - 5
      )
        continue;

      if (
        win.y + 9 >
        height - 5
      )
        continue;


      ctx.fillStyle =
        win.warm
          ? "rgba(255,211,103," +
            win.brightness +
            ")"
          : "rgba(177,214,255," +
            win.brightness +
            ")";


      let drawY;

      if (topBuilding) {

        drawY =
          height -
          win.y -
          9;

      } else {

        drawY =
          y +
          win.y;

      }


      ctx.fillRect(
        x + win.x,
        drawY,
        6,
        9
      );

    }


    // WATER TOWER

    if (
      height > 180 &&
      Math.floor(x) % 3 === 0
    ) {

      let towerY;

      if (topBuilding) {

        towerY =
          height - 29;

      } else {

        towerY =
          y + 28;

      }


      ctx.fillStyle =
        "#13151b";

      ctx.fillRect(
        x + width / 2 - 9,
        towerY - 19,
        18,
        19
      );


      ctx.fillStyle =
        "#0b0d12";

      ctx.fillRect(
        x + width / 2 - 13,
        towerY - 22,
        26,
        4
      );

    }

  }


  // ============================================================
  // ARMORED HERO
  //
  // Original red/gold armored superhero design.
  // Facing right and flying horizontally.
  // ============================================================

  function drawHero() {

    ctx.save();

    ctx.translate(
      hero.x,
      hero.y
    );

    ctx.rotate(
      hero.rotation
    );


    // ----------------------------------------------------------
    // BLUE FOOT THRUSTERS
    // ----------------------------------------------------------

    const flameWave =
      Math.sin(
        hero.flameTime * 18
      ) * 1.5;


    // Left foot flame

    drawBlueThruster(
      -19,
      12,
      flameWave
    );


    // Right foot flame

    drawBlueThruster(
      -19,
      -11,
      -flameWave
    );


    // ----------------------------------------------------------
    // CAPE / AIR TRAIL ACCENT
    // ----------------------------------------------------------

    ctx.fillStyle =
      "rgba(90,160,255,0.15)";

    ctx.beginPath();

    ctx.moveTo(
      -13,
      -5
    );

    ctx.lineTo(
      -39,
      -3
    );

    ctx.lineTo(
      -25,
      3
    );

    ctx.closePath();

    ctx.fill();


    // ----------------------------------------------------------
    // LEGS
    // ----------------------------------------------------------

    // Back leg

    ctx.fillStyle =
      "#a92325";

    ctx.beginPath();

    ctx.roundRect(
      -13,
      5,
      25,
      9,
      4
    );

    ctx.fill();


    // Front leg

    ctx.fillStyle =
      "#c52c2d";

    ctx.beginPath();

    ctx.roundRect(
      -13,
      -14,
      25,
      9,
      4
    );

    ctx.fill();


    // Gold leg armor

    ctx.fillStyle =
      "#d9a62b";

    ctx.fillRect(
      -8,
      -13,
      6,
      7
    );

    ctx.fillRect(
      -8,
      6,
      6,
      7
    );


    // ----------------------------------------------------------
    // TORSO
    // ----------------------------------------------------------

    ctx.fillStyle =
      "#a92124";

    ctx.beginPath();

    ctx.roundRect(
      -7,
      -14,
      29,
      28,
      7
    );

    ctx.fill();


    // Torso highlight

    ctx.fillStyle =
      "#d33131";

    ctx.beginPath();

    ctx.roundRect(
      1,
      -11,
      16,
      22,
      5
    );

    ctx.fill();


    // Gold abdominal armor

    ctx.fillStyle =
      "#d9a62b";

    ctx.fillRect(
      -4,
      -5,
      6,
      4
    );

    ctx.fillRect(
      -4,
      1,
      6,
      4
    );


    // ----------------------------------------------------------
    // ARC-CHEST LIGHT
    // ----------------------------------------------------------

    const coreGlow =
      ctx.createRadialGradient(
        8,
        0,
        1,
        8,
        0,
        10
      );

    coreGlow.addColorStop(
      0,
      "rgba(190,245,255,0.95)"
    );

    coreGlow.addColorStop(
      0.35,
      "rgba(80,190,255,0.65)"
    );

    coreGlow.addColorStop(
      1,
      "rgba(50,120,255,0)"
    );

    ctx.fillStyle =
      coreGlow;

    ctx.beginPath();

    ctx.arc(
      8,
      0,
      10,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#b9f4ff";

    ctx.beginPath();

    ctx.arc(
      8,
      0,
      3.2,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // ----------------------------------------------------------
    // ARMS
    // ----------------------------------------------------------

    // Upper arm

    ctx.fillStyle =
      "#b62628";

    ctx.beginPath();

    ctx.roundRect(
      8,
      -20,
      25,
      9,
      4
    );

    ctx.fill();


    // Forearm

    ctx.fillStyle =
      "#d12d30";

    ctx.beginPath();

    ctx.roundRect(
      27,
      -20,
      17,
      9,
      4
    );

    ctx.fill();


    // Hand

    ctx.fillStyle =
      "#e0aa2f";

    ctx.beginPath();

    ctx.arc(
      44,
      -15.5,
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // Lower arm

    ctx.fillStyle =
      "#b62628";

    ctx.beginPath();

    ctx.roundRect(
      8,
      11,
      25,
      9,
      4
    );

    ctx.fill();


    ctx.fillStyle =
      "#d12d30";

    ctx.beginPath();

    ctx.roundRect(
      27,
      11,
      17,
      9,
      4
    );

    ctx.fill();


    ctx.fillStyle =
      "#e0aa2f";

    ctx.beginPath();

    ctx.arc(
      44,
      15.5,
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // ----------------------------------------------------------
    // HEAD / HELMET
    // ----------------------------------------------------------

    ctx.fillStyle =
      "#c62b2e";

    ctx.beginPath();

    ctx.roundRect(
      15,
      -13,
      22,
      26,
      7
    );

    ctx.fill();


    // Helmet gold faceplate

    ctx.fillStyle =
      "#e0ad35";

    ctx.beginPath();

    ctx.moveTo(
      26,
      -10
    );

    ctx.lineTo(
      38,
      -7
    );

    ctx.lineTo(
      39,
      7
    );

    ctx.lineTo(
      26,
      10
    );

    ctx.closePath();

    ctx.fill();


    // Faceplate red center

    ctx.fillStyle =
      "#a92124";

    ctx.fillRect(
      31,
      -5,
      7,
      10
    );


    // Helmet top ridge

    ctx.fillStyle =
      "#e0ad35";

    ctx.fillRect(
      20,
      -14,
      14,
      4
    );


    // Eyes

    ctx.fillStyle =
      "#bff6ff";

    ctx.fillRect(
      34,
      -6,
      4,
      2.5
    );

    ctx.fillRect(
      34,
      3.5,
      4,
      2.5
    );


    // ----------------------------------------------------------
    // ARMOR OUTLINE
    // ----------------------------------------------------------

    ctx.strokeStyle =
      "rgba(30,10,10,0.65)";

    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.roundRect(
      -7,
      -14,
      29,
      28,
      7
    );

    ctx.stroke();


    ctx.restore();

  }


  // ============================================================
  // BLUE THRUSTER
  // ============================================================

  function drawBlueThruster(
    x,
    y,
    wave
  ) {

    // Outer glow

    const glow =
      ctx.createRadialGradient(
        x - 8,
        y,
        1,
        x - 8,
        y,
        15
      );

    glow.addColorStop(
      0,
      "rgba(70,190,255,0.55)"
    );

    glow.addColorStop(
      1,
      "rgba(30,100,255,0)"
    );

    ctx.fillStyle =
      glow;

    ctx.beginPath();

    ctx.arc(
      x - 8,
      y,
      15,
      0,
      Math.PI * 2
    );

    ctx.fill();


    // Blue flame

    ctx.fillStyle =
      "#168cff";

    ctx.beginPath();

    ctx.moveTo(
      x,
      y - 4
    );

    ctx.lineTo(
      x - 17 - wave,
      y
    );

    ctx.lineTo(
      x,
      y + 4
    );

    ctx.closePath();

    ctx.fill();


    // White-hot center

    ctx.fillStyle =
      "#d9f7ff";

    ctx.beginPath();

    ctx.moveTo(
      x - 1,
      y - 2
    );

    ctx.lineTo(
      x - 9 - wave * 0.4,
      y
    );

    ctx.lineTo(
      x - 1,
      y + 2
    );

    ctx.closePath();

    ctx.fill();

  }


  // ============================================================
  // GROUND
  // ============================================================

  function drawGround() {

    ctx.fillStyle =
      "#090d15";

    ctx.fillRect(
      0,
      groundY,
      W,
      H - groundY
    );


    // Sidewalk

    ctx.fillStyle =
      "#292d36";

    ctx.fillRect(
      0,
      groundY,
      W,
      12
    );


    // Sidewalk seams

    ctx.strokeStyle =
      "#444953";

    ctx.lineWidth = 2;


    for (
      let x = -20;
      x < W + 40;
      x += 40
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x,
        groundY
      );

      ctx.lineTo(
        x - 15,
        H
      );

      ctx.stroke();

    }


    // Road stripe

    ctx.fillStyle =
      "#1b2029";

    ctx.fillRect(
      0,
      groundY + 35,
      W,
      5
    );


    // Yellow city lights

    ctx.fillStyle =
      "#dcb72e";

    for (
      let x = 20;
      x < W;
      x += 100
    ) {

      ctx.fillRect(
        x,
        groundY + 53,
        20,
        4
      );

    }

  }


  // ============================================================
  // PARTICLES
  // ============================================================

  function drawParticles() {

    for (
      const p
      of particles
    ) {

      ctx.globalAlpha =
        Math.max(
          0,
          p.life / p.maxLife
        );

      ctx.fillStyle =
        "#ffffff";

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }

    ctx.globalAlpha = 1;

  }


  // ============================================================
  // GAME LOOP
  // ============================================================

  function loop(timestamp) {

    if (!lastTime)
      lastTime = timestamp;

    let dt =
      (timestamp - lastTime) /
      1000;

    dt =
      Math.min(
        dt,
        0.035
      );

    lastTime =
      timestamp;

    update(dt);

    draw();

    requestAnimationFrame(loop);

  }


  // ============================================================
  // INITIALIZE
  // ============================================================

  resize();

  bestEl.textContent =
    "Best: " + best;

  requestAnimationFrame(loop);

})();
</script>
