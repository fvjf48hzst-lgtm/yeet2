<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Night Flight</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: manipulation;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #02040a;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    color: white;
    text-align: center;
}

#score {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(34px, 7vw, 64px);
    font-weight: 900;
    text-shadow:
        0 3px 0 #000,
        0 0 12px rgba(255,255,255,.25);
    z-index: 5;
}

#best {
    position: absolute;
    top: 86px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 2px;
    opacity: .7;
    text-transform: uppercase;
}

.panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(90%, 430px);
    padding: 30px 24px;
    border-radius: 18px;
    background: rgba(4, 7, 16, .9);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow:
        0 20px 80px rgba(0,0,0,.6),
        inset 0 0 30px rgba(255,255,255,.025);
    backdrop-filter: blur(8px);
    pointer-events: auto;
    z-index: 10;
}

.panel h1 {
    margin: 0 0 10px;
    font-size: clamp(30px, 8vw, 52px);
    font-weight: 900;
    letter-spacing: -2px;
}

.panel p {
    margin: 8px 0;
    color: #c9cfdd;
    line-height: 1.5;
}

.button {
    display: inline-block;
    margin-top: 18px;
    padding: 14px 28px;
    border-radius: 999px;
    background: white;
    color: #080a10;
    font-weight: 900;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 7px 25px rgba(255,255,255,.15);
}

.hidden {
    display: none !important;
}

#warning {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: rgba(255,255,255,.38);
    letter-spacing: 1px;
    white-space: nowrap;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="ui">

    <div id="score">0</div>
    <div id="best">BEST 0</div>

    <div id="startPanel" class="panel">
        <h1>NIGHT FLIGHT</h1>
        <p>Fly through the city.</p>
        <p>Don't hit the buildings.</p>
        <p>Try not to explode.</p>

        <div class="button" id="startButton">
            START FLIGHT
        </div>
    </div>

    <div id="gameOverPanel" class="panel hidden">
        <h1>💥 BOOM!</h1>

        <p id="finalScore">Score: 0</p>
        <p id="finalBest">Best: 0</p>

        <div class="button" id="restartButton">
            FLY AGAIN
        </div>
    </div>

    <div id="warning">
        TAP • CLICK • SPACE • ↑ • W
    </div>

</div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   UI
========================================================= */

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

const startPanel = document.getElementById("startPanel");
const gameOverPanel = document.getElementById("gameOverPanel");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const finalScore = document.getElementById("finalScore");
const finalBest = document.getElementById("finalBest");


/* =========================================================
   GAME STATE
========================================================= */

let state = "menu";

let score = 0;

let best = Number(
    localStorage.getItem("nightFlightBest") || 0
);

bestEl.textContent = "BEST " + best;

let lastTime = performance.now();

let gameTime = 0;

let slowMotion = 1;

let shakePower = 0;

let flashAlpha = 0;

let explosionTimer = 0;

let buildingTimer = 0;


/* =========================================================
   PHYSICS
========================================================= */

const gravity = 1450;
const flapPower = -470;

const BUILDING_WIDTH = 105;
const GAP_HEIGHT = 215;
const BUILDING_SPEED = 250;


/* =========================================================
   SKINNY HERO
========================================================= */

let hero = {

    x: 0,
    y: 0,

    vy: 0,

    /*
       Previously:
       66 x 34

       Now:
       much slimmer body.
    */

    width: 64,
    height: 25,

    rotation: 0
};


/* =========================================================
   OBJECT ARRAYS
========================================================= */

let buildings = [];

let particles = [];

let explosionParticles = [];

let shockwaves = [];

let debris = [];


/* =========================================================
   HELPERS
========================================================= */

function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function rectsOverlap(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


/* =========================================================
   RESET
========================================================= */

function resetGame() {

    score = 0;

    scoreEl.textContent = "0";

    gameTime = 0;

    slowMotion = 1;

    shakePower = 0;

    flashAlpha = 0;

    explosionTimer = 0;

    particles = [];
    explosionParticles = [];
    shockwaves = [];
    debris = [];

    buildings = [];

    hero.x = W * .25;
    hero.y = H * .45;
    hero.vy = 0;
    hero.rotation = 0;

    buildingTimer = 0;

    for (let i = 0; i < 3; i++) {
        createBuilding(
            W + 220 + i * 290
        );
    }
}


/* =========================================================
   START
========================================================= */

function startGame() {

    resetGame();

    state = "playing";

    startPanel.classList.add("hidden");
    gameOverPanel.classList.add("hidden");

    lastTime = performance.now();
}


/* =========================================================
   END GAME
========================================================= */

function endGame() {

    if (state !== "playing") return;

    state = "exploding";

    slowMotion = .2;

    explosionTimer = 0;

    const explosionX =
        hero.x + hero.width / 2;

    const explosionY =
        hero.y + hero.height / 2;

    createMassiveExplosion(
        explosionX,
        explosionY
    );

    shakePower = 42;

    flashAlpha = 1;

    finalScore.textContent =
        "Score: " + score;

    if (score > best) {

        best = score;

        localStorage.setItem(
            "nightFlightBest",
            best
        );
    }

    finalBest.textContent =
        "Best: " + best;

    setTimeout(() => {

        state = "gameover";

        slowMotion = 1;

        gameOverPanel.classList.remove(
            "hidden"
        );

    }, 1250);
}


/* =========================================================
   CONTROLS
========================================================= */

function flap() {

    if (state === "menu") {
        startGame();
        return;
    }

    if (state === "gameover") {
        startGame();
        return;
    }

    if (state !== "playing") return;

    hero.vy = flapPower;
}


window.addEventListener("keydown", e => {

    if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
    ) {

        e.preventDefault();

        flap();
    }
});


canvas.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        flap();
    }
);


startButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();

        startGame();
    }
);


restartButton.addEventListener(
    "click",
    e => {

        e.stopPropagation();

        startGame();
    }
);


/* =========================================================
   BUILDINGS
========================================================= */

function createBuilding(x) {

    const gapCenter = rand(
        H * .28,
        H * .68
    );

    const topHeight =
        gapCenter - GAP_HEIGHT / 2;

    const bottomY =
        gapCenter + GAP_HEIGHT / 2;

    buildings.push({

        x: x,

        width: BUILDING_WIDTH,

        topHeight: topHeight,

        bottomY: bottomY,

        passed: false,

        type: Math.floor(
            rand(0, 5)
        )
    });
}


function updateBuildings(dt) {

    buildingTimer -= dt;

    if (buildingTimer <= 0) {

        const last =
            buildings[buildings.length - 1];

        if (!last || last.x < W - 200) {

            createBuilding(W + 80);

            buildingTimer = 1.35;
        }
    }


    for (
        let i = buildings.length - 1;
        i >= 0;
        i--
    ) {

        const b = buildings[i];

        b.x -=
            BUILDING_SPEED * dt;


        if (
            !b.passed &&
            b.x + b.width < hero.x
        ) {

            b.passed = true;

            score++;

            scoreEl.textContent =
                score;
        }


        if (
            b.x + b.width < -150
        ) {

            buildings.splice(i, 1);
        }
    }
}


/* =========================================================
   HERO PHYSICS
========================================================= */

function updateHero(dt) {

    hero.vy +=
        gravity * dt;

    hero.y +=
        hero.vy * dt;


    hero.rotation =
        clamp(
            hero.vy / 900,
            -.35,
            .55
        );


    if (
        hero.y < -100 ||
        hero.y > H + 80
    ) {

        endGame();

        return;
    }


    /*
       Skinny collision box.
       This is slightly smaller than
       the visual character so the game
       feels fair.
    */

    const hitbox = {

        x: hero.x + 7,

        y: hero.y + 5,

        width: hero.width - 14,

        height: hero.height - 10
    };


    for (const b of buildings) {

        const top = {

            x: b.x,

            y: 0,

            width: b.width,

            height: b.topHeight
        };


        const bottom = {

            x: b.x,

            y: b.bottomY,

            width: b.width,

            height:
                H - b.bottomY
        };


        if (
            rectsOverlap(
                hitbox,
                top
            ) ||
            rectsOverlap(
                hitbox,
                bottom
            )
        ) {

            endGame();

            return;
        }
    }
}


/* =========================================================
   SKY
========================================================= */

function drawSky() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#020611"
    );

    gradient.addColorStop(
        .45,
        "#071327"
    );

    gradient.addColorStop(
        1,
        "#10101b"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* stars */

    ctx.fillStyle =
        "rgba(255,255,255,.75)";

    for (let i = 0; i < 130; i++) {

        const x =
            (i * 83) % W;

        const y =
            (i * 47) % (H * .55);

        const size =
            ((i * 17) % 10) / 10 + .35;

        ctx.fillRect(
            x,
            y,
            size,
            size
        );
    }


    /* moon */

    const moonX =
        W * .82;

    const moonY =
        H * .17;

    const moonR =
        Math.min(W, H) * .055;


    ctx.beginPath();

    ctx.arc(
        moonX,
        moonY,
        moonR,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#e9edf7";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        moonX + moonR * .35,
        moonY - moonR * .12,
        moonR,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#071327";

    ctx.fill();
}


/* =========================================================
   DISTANT NYC SKYLINE
========================================================= */

function drawDistantCity() {

    const base =
        H * .78;


    ctx.fillStyle =
        "#090d17";


    for (let i = 0; i < 42; i++) {

        const width =
            30 + ((i * 19) % 55);

        const height =
            60 + ((i * 73) % 160);

        const x =
            i * (W / 34);

        ctx.fillRect(
            x,
            base - height,
            width,
            height
        );
    }


    /* Empire State style silhouette */

    const center =
        W * .53;


    ctx.fillStyle =
        "#070b13";


    ctx.fillRect(
        center - 38,
        base - 275,
        76,
        275
    );


    ctx.fillRect(
        center - 25,
        base - 325,
        50,
        50
    );


    ctx.fillRect(
        center - 14,
        base - 365,
        28,
        40
    );


    ctx.fillRect(
        center - 3,
        base - 410,
        6,
        45
    );


    /* windows */

    ctx.fillStyle =
        "rgba(255,210,100,.18)";

    for (let i = 0; i < 90; i++) {

        const x =
            (i * 71) % W;

        const y =
            base -
            ((i * 43) % 190);

        ctx.fillRect(
            x,
            y,
            3,
            5
        );
    }
}


/* =========================================================
   MAIN BUILDINGS
========================================================= */

function drawBuilding(b) {

    drawCityBuilding(
        b.x,
        0,
        b.width,
        b.topHeight,
        b.type,
        true
    );


    drawCityBuilding(
        b.x,
        b.bottomY,
        b.width,
        H - b.bottomY,
        b.type,
        false
    );
}


function drawCityBuilding(
    x,
    y,
    width,
    height,
    type,
    fromTop
) {

    if (height <= 0) return;


    let baseColor;


    if (type === 0)
        baseColor = "#18202c";

    if (type === 1)
        baseColor = "#24262d";

    if (type === 2)
        baseColor = "#142b3b";

    if (type === 3)
        baseColor = "#302a29";

    if (type === 4)
        baseColor = "#202938";


    ctx.fillStyle =
        baseColor;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    /* roof */

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fillRect(
        x,
        fromTop
            ? height - 6
            : y,
        width,
        6
    );


    /* windows */

    const cols = 4;

    const rows =
        Math.floor(
            height / 30
        );


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < cols;
            col++
        ) {

            const wx =
                x +
                13 +
                col * 23;


            let wy;


            if (fromTop) {

                wy =
                    height -
                    23 -
                    row * 30;

            } else {

                wy =
                    y +
                    16 +
                    row * 30;
            }


            if (
                wy < y ||
                wy + 12 >
                y + height
            ) {
                continue;
            }


            const pattern =
                (
                    row * 17 +
                    col * 29 +
                    type * 13
                ) % 9;


            if (pattern < 2) {

                ctx.fillStyle =
                    "rgba(255,210,100,.7)";

            } else if (pattern < 4) {

                ctx.fillStyle =
                    "rgba(160,210,255,.5)";

            } else {

                ctx.fillStyle =
                    "rgba(100,130,160,.18)";
            }


            ctx.fillRect(
                wx,
                wy,
                9,
                12
            );
        }
    }


    /* rooftop details */

    if (fromTop) {

        ctx.fillStyle =
            "rgba(0,0,0,.35)";


        if (type === 1) {

            ctx.fillRect(
                x + 15,
                height - 23,
                18,
                17
            );

            ctx.fillRect(
                x + 69,
                height - 29,
                14,
                23
            );

        } else if (type === 2) {

            ctx.fillRect(
                x + width / 2 - 2,
                height - 35,
                4,
                29
            );
        }
    }
}


/* =========================================================
   GROUND
========================================================= */

function drawGround() {

    const groundY =
        H * .93;


    ctx.fillStyle =
        "#080b11";

    ctx.fillRect(
        0,
        groundY,
        W,
        H - groundY
    );


    ctx.fillStyle =
        "#181b22";

    ctx.fillRect(
        0,
        groundY,
        W,
        7
    );


    ctx.fillStyle =
        "#343841";


    for (
        let x = -40;
        x < W + 40;
        x += 80
    ) {

        ctx.fillRect(
            x,
            groundY + 18,
            48,
            4
        );
    }
}


/* =========================================================
   SKINNY ARMORED HERO
========================================================= */

function drawHero() {

    ctx.save();


    const cx =
        hero.x +
        hero.width / 2;

    const cy =
        hero.y +
        hero.height / 2;


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        hero.rotation
    );


    /*
       BLUE THRUSTERS
    */

    drawThruster(
        -29,
        -6,
        1
    );

    drawThruster(
        -29,
        6,
        1
    );


    /*
       BACK / SHOULDERS
    */

    ctx.fillStyle =
        "#781017";


    ctx.beginPath();

    ctx.moveTo(-19, -8);

    ctx.lineTo(-32, -11);

    ctx.lineTo(-38, -4);

    ctx.lineTo(-25, -1);

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(-19, 8);

    ctx.lineTo(-32, 11);

    ctx.lineTo(-38, 4);

    ctx.lineTo(-25, 1);

    ctx.closePath();

    ctx.fill();


    /*
       SKINNY TORSO
    */

    const bodyGradient =
        ctx.createLinearGradient(
            -15,
            -12,
            18,
            12
        );


    bodyGradient.addColorStop(
        0,
        "#94151d"
    );

    bodyGradient.addColorStop(
        .5,
        "#e12a33"
    );

    bodyGradient.addColorStop(
        1,
        "#711018"
    );


    ctx.fillStyle =
        bodyGradient;


    ctx.beginPath();

    ctx.roundRect(
        -18,
        -9,
        39,
        18,
        6
    );

    ctx.fill();


    /*
       CHEST GOLD STRIP
    */

    ctx.fillStyle =
        "#dca82e";


    ctx.beginPath();

    ctx.moveTo(
        -4,
        -9
    );

    ctx.lineTo(
        15,
        -7
    );

    ctx.lineTo(
        18,
        0
    );

    ctx.lineTo(
        15,
        7
    );

    ctx.lineTo(
        -4,
        9
    );

    ctx.closePath();

    ctx.fill();


    /*
       BLUE ARC REACTOR
    */

    ctx.beginPath();

    ctx.arc(
        7,
        0,
        4.2,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#bcecff";

    ctx.shadowBlur = 15;

    ctx.shadowColor =
        "#20aaff";

    ctx.fill();

    ctx.shadowBlur = 0;


    /*
       SKINNY ARMS
    */

    ctx.strokeStyle =
        "#9c1821";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";


    ctx.beginPath();

    ctx.moveTo(
        5,
        -7
    );

    ctx.lineTo(
        22,
        -12
    );

    ctx.lineTo(
        28,
        -9
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        5,
        7
    );

    ctx.lineTo(
        22,
        12
    );

    ctx.lineTo(
        28,
        9
    );

    ctx.stroke();


    /*
       GOLD FOREARM DETAILS
    */

    ctx.strokeStyle =
        "#e0ad36";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        19,
        -11
    );

    ctx.lineTo(
        26,
        -9
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        19,
        11
    );

    ctx.lineTo(
        26,
        9
    );

    ctx.stroke();


    /*
       HEAD / HELMET
    */

    const helmetGradient =
        ctx.createLinearGradient(
            14,
            -11,
            33,
            8
        );


    helmetGradient.addColorStop(
        0,
        "#e33138"
    );

    helmetGradient.addColorStop(
        .6,
        "#b91923"
    );

    helmetGradient.addColorStop(
        1,
        "#731017"
    );


    ctx.fillStyle =
        helmetGradient;


    ctx.beginPath();

    ctx.roundRect(
        15,
        -9,
        19,
        18,
        6
    );

    ctx.fill();


    /*
       GOLD FACEPLATE
    */

    ctx.fillStyle =
        "#e3b13b";


    ctx.beginPath();

    ctx.moveTo(
        25,
        -6
    );

    ctx.lineTo(
        35,
        -3
    );

    ctx.lineTo(
        35,
        3
    );

    ctx.lineTo(
        25,
        6
    );

    ctx.closePath();

    ctx.fill();


    /*
       EYE SLIT
    */

    ctx.fillStyle =
        "#e9fbff";

    ctx.shadowBlur = 7;

    ctx.shadowColor =
        "#37c8ff";


    ctx.fillRect(
        27,
        -3,
        6,
        2
    );


    ctx.fillRect(
        27,
        1,
        6,
        2
    );


    ctx.shadowBlur = 0;


    /*
       ARMOR LINES
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.18)";

    ctx.lineWidth = 1;


    ctx.beginPath();

    ctx.moveTo(
        -12,
        -7
    );

    ctx.lineTo(
        -1,
        -4
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        -12,
        7
    );

    ctx.lineTo(
        -1,
        4
    );

    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   THRUSTERS
========================================================= */

function drawThruster(
    x,
    y,
    direction
) {

    const length =
        rand(10, 18);


    const gradient =
        ctx.createLinearGradient(
            x,
            y,
            x - length,
            y
        );


    gradient.addColorStop(
        0,
        "#e9fbff"
    );

    gradient.addColorStop(
        .25,
        "#45c8ff"
    );

    gradient.addColorStop(
        1,
        "rgba(20,130,255,0)"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 3
    );

    ctx.lineTo(
        x - length,
        y
    );

    ctx.lineTo(
        x,
        y + 3
    );

    ctx.closePath();

    ctx.fill();
}


/* =========================================================
   NORMAL PARTICLES
========================================================= */

function spawnNormalParticle() {

    particles.push({

        x: hero.x - 20,

        y:
            hero.y +
            hero.height / 2 +
            rand(-5, 5),

        vx: rand(-50, -15),

        vy: rand(-20, 20),

        life: .3,

        size: rand(1, 3)
    });
}


function updateNormalParticles(dt) {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.life -= dt;

        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;

        if (p.life <= 0) {

            particles.splice(
                i,
                1
            );
        }
    }
}


function drawNormalParticles() {

    for (const p of particles) {

        ctx.globalAlpha =
            Math.max(
                0,
                p.life / .3
            );

        ctx.fillStyle =
            "#3ebcff";

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   MASSIVE EXPLOSION
========================================================= */

function createMassiveExplosion(
    x,
    y
) {

    /*
       HUGE central fireball
    */

    for (let i = 0; i < 120; i++) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            rand(80, 850);

        explosionParticles.push({

            x: x + rand(-8, 8),

            y: y + rand(-8, 8),

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                rand(.45, 1.5),

            maxLife:
                1.5,

            size:
                rand(2, 12),

            type:
                Math.random()
        });
    }


    /*
       Massive smoke
    */

    for (let i = 0; i < 55; i++) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            rand(0, 80);

        explosionParticles.push({

            x:
                x +
                Math.cos(angle) *
                distance,

            y:
                y +
                Math.sin(angle) *
                distance,

            vx:
                Math.cos(angle) *
                rand(10, 180),

            vy:
                Math.sin(angle) *
                rand(10, 180) -
                rand(20, 100),

            life:
                rand(.8, 2.1),

            maxLife:
                2.1,

            size:
                rand(12, 38),

            type:
                2
        });
    }


    /*
       Shockwaves
    */

    shockwaves.push({

        x,
        y,

        radius: 10,

        maxRadius: 330,

        life: .8,

        maxLife: .8,

        width: 9
    });


    shockwaves.push({

        x,
        y,

        radius: 5,

        maxRadius: 180,

        life: .5,

        maxLife: .5,

        width: 4
    });


    /*
       Building debris
    */

    for (let i = 0; i < 45; i++) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            rand(100, 700);

        debris.push({

            x: x + rand(-25, 25),

            y: y + rand(-25, 25),

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            rotation:
                rand(0, Math.PI * 2),

            rotationSpeed:
                rand(-10, 10),

            size:
                rand(3, 13),

            life:
                rand(.6, 1.8),

            maxLife:
                1.8
        });
    }


    /*
       White-hot flash
    */

    flashAlpha = 1;
}


/* =========================================================
   EXPLOSION UPDATE
========================================================= */

function updateExplosion(dt) {

    const explosionDt =
        dt * slowMotion;


    explosionTimer += dt;


    for (
        let i =
            explosionParticles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            explosionParticles[i];

        p.life -=
            explosionDt;

        p.x +=
            p.vx * explosionDt;

        p.y +=
            p.vy * explosionDt;


        if (p.type === 2) {

            p.vy -=
                25 * explosionDt;

            p.vx *=
                .985;

            p.vy *=
                .985;

        } else {

            p.vy +=
                260 * explosionDt;

            p.vx *=
                .992;

            p.vy *=
                .992;
        }


        if (p.life <= 0) {

            explosionParticles.splice(
                i,
                1
            );
        }
    }


    for (
        let i = debris.length - 1;
        i >= 0;
        i--
    ) {

        const d =
            debris[i];

        d.life -=
            explosionDt;

        d.x +=
            d.vx * explosionDt;

        d.y +=
            d.vy * explosionDt;

        d.vy +=
            500 * explosionDt;

        d.rotation +=
            d.rotationSpeed *
            explosionDt;

        d.vx *=
            .985;


        if (d.life <= 0) {

            debris.splice(
                i,
                1
            );
        }
    }


    for (
        let i = shockwaves.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            shockwaves[i];

        s.life -=
            explosionDt;

        const progress =
            1 -
            s.life /
            s.maxLife;

        s.radius =
            lerp(
                5,
                s.maxRadius,
                progress
            );


        if (s.life <= 0) {

            shockwaves.splice(
                i,
                1
            );
        }
    }


    shakePower *=
        Math.pow(
            .035,
            explosionDt
        );


    flashAlpha *=
        Math.pow(
            .012,
            explosionDt
        );
}


/* =========================================================
   EXPLOSION DRAW
========================================================= */

function drawExplosion() {

    /*
       White flash
    */

    if (flashAlpha > .01) {

        ctx.fillStyle =
            "rgba(255,245,220," +
            flashAlpha * .55 +
            ")";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }


    /*
       Shockwaves
    */

    for (const s of shockwaves) {

        const alpha =
            Math.max(
                0,
                s.life /
                s.maxLife
            );


        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(255,220,150," +
            alpha +
            ")";

        ctx.lineWidth =
            s.width *
            alpha;

        ctx.stroke();
    }


    /*
       Fire / smoke particles
    */

    for (
        const p of explosionParticles
    ) {

        const alpha =
            clamp(
                p.life /
                p.maxLife,
                0,
                1
            );


        ctx.globalAlpha =
            alpha;


        if (p.type === 2) {

            /*
               Smoke
            */

            ctx.fillStyle =
                "rgba(40,43,48,.8)";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size *
                (1.2 - alpha * .2),
                0,
                Math.PI * 2
            );

            ctx.fill();

        } else {

            /*
               Fireball
            */

            const fireGradient =
                ctx.createRadialGradient(
                    p.x,
                    p.y,
                    0,
                    p.x,
                    p.y,
                    p.size
                );


            fireGradient.addColorStop(
                0,
                "#fffde0"
            );

            fireGradient.addColorStop(
                .25,
                "#fff08a"
            );

            fireGradient.addColorStop(
                .6,
                "#ff9c1a"
            );

            fireGradient.addColorStop(
                1,
                "rgba(220,35,10,0)"
            );


            ctx.fillStyle =
                fireGradient;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }


    ctx.globalAlpha = 1;


    /*
       Debris
    */

    for (const d of debris) {

        const alpha =
            clamp(
                d.life /
                d.maxLife,
                0,
                1
            );

        ctx.save();

        ctx.globalAlpha =
            alpha;

        ctx.translate(
            d.x,
            d.y
        );

        ctx.rotate(
            d.rotation
        );

        ctx.fillStyle =
            "#7c7e82";

        ctx.fillRect(
            -d.size / 2,
            -d.size / 2,
            d.size,
            d.size
        );

        ctx.restore();
    }

    ctx.globalAlpha = 1;
}


/* =========================================================
   SCREEN SHAKE
========================================================= */

function beginShake() {

    if (shakePower <= .1) return;

    const x =
        rand(
            -shakePower,
            shakePower
        );

    const y =
        rand(
            -shakePower,
            shakePower
        );

    ctx.translate(
        x,
        y
    );
}


/* =========================================================
   MAIN DRAW
========================================================= */

function draw() {

    ctx.save();

    beginShake();

    drawSky();

    drawDistantCity();


    for (const b of buildings) {

        drawBuilding(b);
    }


    drawGround();


    if (
        state === "playing" ||
        state === "menu"
    ) {

        drawNormalParticles();

        drawHero();
    }


    if (
        state === "exploding" ||
        state === "gameover"
    ) {

        drawExplosion();
    }


    ctx.restore();
}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(dt) {

    if (state === "playing") {

        gameTime += dt;

        updateHero(dt);

        if (state !== "playing") {
            return;
        }

        updateBuildings(dt);

        spawnNormalParticle();

        updateNormalParticles(dt);

    } else if (
        state === "exploding"
    ) {

        updateExplosion(dt);
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(now) {

    let dt =
        (now - lastTime) /
        1000;

    lastTime = now;

    dt =
        Math.min(
            dt,
            .035
        );

    update(dt);

    draw();

    requestAnimationFrame(
        loop
    );
}


resetGame();

requestAnimationFrame(
    loop
);

</script>
