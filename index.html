<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NYC Night Flight</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050817;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }

    #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: white;
    }

    #score {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 42px;
        font-weight: 900;
        text-shadow:
            0 3px 0 #000,
            0 0 12px rgba(255,255,255,.35);
        z-index: 5;
    }

    #best {
        position: absolute;
        top: 67px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        font-weight: bold;
        opacity: .75;
        text-shadow: 0 2px 3px #000;
    }

    #hint {
        position: absolute;
        bottom: 22px;
        width: 100%;
        text-align: center;
        font-size: 13px;
        opacity: .55;
    }

    #start {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        border: 2px solid rgba(255,255,255,.65);
        background: rgba(5,10,25,.82);
        color: white;
        padding: 15px 27px;
        border-radius: 14px;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 8px 35px rgba(0,0,0,.45);
    }

    #start:active {
        transform: translate(-50%, -50%) scale(.96);
    }
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div id="score">0</div>
    <div id="best">BEST: 0</div>
    <div id="hint">SPACE / TAP / CLICK / W / ↑</div>
    <button id="start">START FLIGHT</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const startBtn = document.getElementById("start");

let W = 0;
let H = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();


// --------------------------------------------------
// GAME STATE
// --------------------------------------------------

let state = "menu";

let score = 0;
let best = Number(localStorage.getItem("nycFlightBest") || 0);

bestEl.textContent = "BEST: " + best;

const gravity = 1250;
const flapPower = -390;
const buildingSpeed = 215;

let spawnTimer = 0;

let shakePower = 0;
let explosionTimer = 0;

let buildings = [];
let particles = [];
let explosionParticles = [];
let shockwaves = [];
let debris = [];


// --------------------------------------------------
// HERO
// --------------------------------------------------

const hero = {
    x: 0,
    y: 0,
    vy: 0,
    rotation: 0,
    width: 64,
    height: 24
};


// --------------------------------------------------
// SKYLINE
// --------------------------------------------------

const skyline = [];

function createSkyline() {
    skyline.length = 0;

    let x = 0;

    while (x < W + 200) {
        const width = 45 + Math.random() * 75;
        const height = 90 + Math.random() * 180;

        skyline.push({
            x,
            width,
            height,
            windows: []
        });

        for (let wx = 10; wx < width - 8; wx += 13) {
            for (let wy = 12; wy < height - 8; wy += 18) {
                if (Math.random() > 0.42) {
                    skyline[skyline.length - 1].windows.push({
                        x: wx,
                        y: wy
                    });
                }
            }
        }

        x += width + 5;
    }
}

createSkyline();


// --------------------------------------------------
// BUILDINGS / OBSTACLES
// --------------------------------------------------

function createBuilding(x) {
    const gap = Math.max(145, Math.min(205, H * 0.23));

    const minTop = 70;
    const maxTop = H - gap - 100;

    const topHeight =
        minTop + Math.random() * Math.max(30, maxTop - minTop);

    const bottomY = topHeight + gap;

    return {
        x: x,
        width: 90 + Math.random() * 45,
        topHeight: topHeight,
        bottomY: bottomY,
        scored: false
    };
}

function resetBuildings() {
    buildings = [];

    let x = W + 220;

    for (let i = 0; i < 4; i++) {
        const b = createBuilding(x);
        buildings.push(b);
        x += 310 + Math.random() * 100;
    }
}


// --------------------------------------------------
// START / RESET
// --------------------------------------------------

function resetGame() {
    score = 0;
    scoreEl.textContent = "0";

    hero.x = W * 0.25;
    hero.y = H * 0.45;
    hero.vy = 0;
    hero.rotation = 0;

    particles = [];
    explosionParticles = [];
    shockwaves = [];
    debris = [];

    shakePower = 0;
    explosionTimer = 0;
    spawnTimer = 0;

    resetBuildings();
}

function startGame() {
    resetGame();
    state = "playing";
    startBtn.style.display = "none";
}

startBtn.addEventListener("click", startGame);


// --------------------------------------------------
// CONTROLS
// --------------------------------------------------

function flap() {
    if (state === "menu") {
        startGame();
        return;
    }

    if (state === "playing") {
        hero.vy = flapPower;

        for (let i = 0; i < 5; i++) {
            particles.push({
                x: hero.x - hero.width / 2,
                y: hero.y + 7,
                vx: -40 - Math.random() * 70,
                vy: (Math.random() - .5) * 50,
                life: .25 + Math.random() * .2,
                size: 2 + Math.random() * 2
            });
        }
    }
}

window.addEventListener("keydown", e => {
    if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "KeyW"
    ) {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    flap();
});


// --------------------------------------------------
// BUILDING DRAWING
// --------------------------------------------------

function drawBuilding(b) {
    // TOP BUILDING
    ctx.fillStyle = "#10182a";
    ctx.fillRect(b.x, 0, b.width, b.topHeight);

    // roof
    ctx.fillStyle = "#172039";
    ctx.fillRect(b.x - 4, b.topHeight - 7, b.width + 8, 7);

    // windows
    const windowW = 7;
    const windowH = 11;

    for (let x = b.x + 12; x < b.x + b.width - 7; x += 17) {
        for (let y = 17; y < b.topHeight - 10; y += 22) {
            ctx.fillStyle = "#f5c95b";
            ctx.fillRect(x, y, windowW, windowH);
        }
    }

    // BOTTOM BUILDING
    ctx.fillStyle = "#10182a";
    ctx.fillRect(
        b.x,
        b.bottomY,
        b.width,
        H - b.bottomY
    );

    ctx.fillStyle = "#172039";
    ctx.fillRect(
        b.x - 4,
        b.bottomY,
        b.width + 8,
        7
    );

    for (
        let x = b.x + 12;
        x < b.x + b.width - 7;
        x += 17
    ) {
        for (
            let y = b.bottomY + 20;
            y < H - 10;
            y += 22
        ) {
            ctx.fillStyle = "#f5c95b";
            ctx.fillRect(x, y, windowW, windowH);
        }
    }
}


// --------------------------------------------------
// HERO DRAWING
// --------------------------------------------------

function drawHero() {
    ctx.save();

    ctx.translate(hero.x, hero.y);
    ctx.rotate(hero.rotation);

    // blue foot thrusters
    const flame = 8 + Math.random() * 4;

    ctx.beginPath();
    ctx.moveTo(-30, -4);
    ctx.lineTo(-30 - flame, 0);
    ctx.lineTo(-30, 4);
    ctx.closePath();
    ctx.fillStyle = "#00bfff";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-30, -2);
    ctx.lineTo(-30 - flame * .65, 0);
    ctx.lineTo(-30, 2);
    ctx.closePath();
    ctx.fillStyle = "#b9f7ff";
    ctx.fill();

    // legs
    ctx.fillStyle = "#7b111b";
    ctx.fillRect(-25, 5, 15, 7);

    // main body
    ctx.fillStyle = "#9e1720";
    ctx.beginPath();
    ctx.roundRect(-25, -9, 40, 18, 7);
    ctx.fill();

    // gold chest
    ctx.fillStyle = "#e7b932";
    ctx.beginPath();
    ctx.roundRect(-9, -7, 17, 14, 4);
    ctx.fill();

    // chest reactor
    ctx.beginPath();
    ctx.arc(1, 0, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#bffaff";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(1, 0, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    // head
    ctx.fillStyle = "#b51e27";
    ctx.beginPath();
    ctx.roundRect(10, -8, 15, 16, 5);
    ctx.fill();

    // helmet
    ctx.fillStyle = "#d7a92d";
    ctx.beginPath();
    ctx.roundRect(17, -7, 9, 14, 3);
    ctx.fill();

    // visor
    ctx.fillStyle = "#162d44";
    ctx.fillRect(22, -4, 7, 8);

    // arms
    ctx.fillStyle = "#8e141d";

    ctx.beginPath();
    ctx.roundRect(-16, -14, 25, 6, 3);
    ctx.fill();

    ctx.beginPath();
    ctx.roundRect(-16, 8, 25, 6, 3);
    ctx.fill();

    // shoulder armor
    ctx.fillStyle = "#d2a62c";
    ctx.beginPath();
    ctx.arc(-16, -11, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(-16, 11, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}


// --------------------------------------------------
// COLLISION
// --------------------------------------------------

function heroHitsBuilding(b) {
    const left = hero.x - hero.width / 2;
    const right = hero.x + hero.width / 2;
    const top = hero.y - hero.height / 2;
    const bottom = hero.y + hero.height / 2;

    if (
        right > b.x &&
        left < b.x + b.width
    ) {
        if (
            top < b.topHeight ||
            bottom > b.bottomY
        ) {
            return true;
        }
    }

    return false;
}


// --------------------------------------------------
// HUGE EXPLOSION
// --------------------------------------------------

function createExplosion() {
    explosionParticles = [];
    shockwaves = [];
    debris = [];

    // Massive fireball particles
    for (let i = 0; i < 170; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 700;

        const colors = [
            "#ffffff",
            "#fff4a3",
            "#ffd21f",
            "#ff9d00",
            "#ff4d00",
            "#e51b23",
            "#8f1018"
        ];

        explosionParticles.push({
            x: hero.x,
            y: hero.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: .45 + Math.random() * 1.05,
            maxLife: 1.5,
            size: 2 + Math.random() * 9,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }

    // Large fireball core
    for (let i = 0; i < 55; i++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 65;

        explosionParticles.push({
            x: hero.x + Math.cos(angle) * distance,
            y: hero.y + Math.sin(angle) * distance,
            vx: Math.cos(angle) * (30 + Math.random() * 160),
            vy: Math.sin(angle) * (30 + Math.random() * 160),
            life: .5 + Math.random() * .5,
            maxLife: 1,
            size: 8 + Math.random() * 20,
            color: Math.random() > .5 ? "#ffae00" : "#ff4a00"
        });
    }

    // Shockwaves
    shockwaves.push({
        x: hero.x,
        y: hero.y,
        radius: 10,
        maxRadius: 230,
        life: 1
    });

    shockwaves.push({
        x: hero.x,
        y: hero.y,
        radius: 5,
        maxRadius: 120,
        life: 1
    });

    // Debris
    for (let i = 0; i < 35; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 450;

        debris.push({
            x: hero.x,
            y: hero.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            rotation: Math.random() * Math.PI,
            spin: (Math.random() - .5) * 15,
            life: 1 + Math.random(),
            size: 3 + Math.random() * 8,
            color: Math.random() > .5 ? "#9b1822" : "#d9aa2c"
        });
    }
}


// --------------------------------------------------
// CRASH
// --------------------------------------------------

function crash() {
    if (state !== "playing") return;

    state = "exploding";

    // SCORE RESETS AFTER CRASH
    score = 0;
    scoreEl.textContent = "0";

    createExplosion();

    shakePower = 35;

    // Explosion lasts about 1.3 seconds
    explosionTimer = 1.3;
}


// --------------------------------------------------
// RESPAWN
// --------------------------------------------------

function respawn() {
    state = "playing";

    hero.x = W * 0.25;
    hero.y = H * 0.45;
    hero.vy = 0;
    hero.rotation = 0;

    particles = [];
    explosionParticles = [];
    shockwaves = [];
    debris = [];

    shakePower = 0;
    explosionTimer = 0;

    // Rebuild obstacles so the player doesn't instantly hit
    // the exact building that caused the explosion.
    resetBuildings();
}


// --------------------------------------------------
// UPDATE HERO
// --------------------------------------------------

function updateHero(dt) {
    hero.vy += gravity * dt;
    hero.y += hero.vy * dt;

    hero.rotation = Math.max(
        -0.22,
        Math.min(0.55, hero.vy / 650)
    );

    if (
        hero.y - hero.height / 2 < 0 ||
        hero.y + hero.height / 2 > H
    ) {
        crash();
    }
}


// --------------------------------------------------
// UPDATE BUILDINGS
// --------------------------------------------------

function updateBuildings(dt) {
    for (const b of buildings) {
        b.x -= buildingSpeed * dt;

        if (
            !b.scored &&
            b.x + b.width < hero.x
        ) {
            b.scored = true;
            score++;

            scoreEl.textContent = score;

            if (score > best) {
                best = score;
                bestEl.textContent = "BEST: " + best;
                localStorage.setItem("nycFlightBest", best);
            }
        }

        if (heroHitsBuilding(b)) {
            crash();
        }
    }

    // Add new buildings
    const last = buildings[buildings.length - 1];

    if (last && last.x < W - 220) {
        buildings.push(
            createBuilding(last.x + 310 + Math.random() * 100)
        );
    }

    buildings = buildings.filter(
        b => b.x + b.width > -100
    );
}


// --------------------------------------------------
// PARTICLES
// --------------------------------------------------

function updateParticles(dt) {
    for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
    }

    particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life * 4);

        ctx.fillStyle = "#3fd8ff";

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


// --------------------------------------------------
// EXPLOSION UPDATE
// --------------------------------------------------

function updateExplosion(dt) {
    // Move buildings during the explosion so the world
    // doesn't freeze completely.
    for (const b of buildings) {
        b.x -= buildingSpeed * dt * 0.55;
    }

    for (const p of explosionParticles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= 0.985;
        p.vy *= 0.985;

        p.vy += 260 * dt;

        p.life -= dt;
    }

    explosionParticles =
        explosionParticles.filter(p => p.life > 0);

    for (const s of shockwaves) {
        s.radius +=
            (s.maxRadius - s.radius) * dt * 5;

        s.life -= dt;
    }

    shockwaves =
        shockwaves.filter(s => s.life > 0);

    for (const d of debris) {
        d.x += d.vx * dt;
        d.y += d.vy * dt;

        d.vy += 500 * dt;
        d.rotation += d.spin * dt;

        d.life -= dt;
    }

    debris =
        debris.filter(d => d.life > 0);

    // Shake fades naturally
    shakePower *= Math.pow(0.05, dt);

    explosionTimer -= dt;

    if (explosionTimer <= 0) {
        respawn();
    }
}


// --------------------------------------------------
// DRAW EXPLOSION
// --------------------------------------------------

function drawExplosion() {
    // Fireball glow — NOT a screen flash.
    // Everything is localized around the impact.
    const gradient = ctx.createRadialGradient(
        hero.x,
        hero.y,
        0,
        hero.x,
        hero.y,
        180
    );

    gradient.addColorStop(0, "rgba(255,255,220,.95)");
    gradient.addColorStop(.12, "rgba(255,230,70,.9)");
    gradient.addColorStop(.32, "rgba(255,110,0,.75)");
    gradient.addColorStop(.58, "rgba(220,35,10,.35)");
    gradient.addColorStop(1, "rgba(120,0,0,0)");

    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.arc(
        hero.x,
        hero.y,
        180,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Shockwaves
    for (const s of shockwaves) {
        ctx.save();

        ctx.globalAlpha = Math.max(0, s.life);

        ctx.strokeStyle = "#ffb300";
        ctx.lineWidth = 5;

        ctx.beginPath();
        ctx.arc(
            s.x,
            s.y,
            s.radius,
            0,
            Math.PI * 2
        );
        ctx.stroke();

        ctx.strokeStyle = "#fff4b0";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(
            s.x,
            s.y,
            s.radius * .82,
            0,
            Math.PI * 2
        );
        ctx.stroke();

        ctx.restore();
    }

    // Explosion particles
    for (const p of explosionParticles) {
        const alpha =
            Math.max(0, Math.min(1, p.life * 2));

        ctx.globalAlpha = alpha;

        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;

    // Debris
    for (const d of debris) {
        ctx.save();

        ctx.translate(d.x, d.y);
        ctx.rotate(d.rotation);

        ctx.globalAlpha =
            Math.max(0, Math.min(1, d.life));

        ctx.fillStyle = d.color;

        ctx.fillRect(
            -d.size / 2,
            -d.size / 2,
            d.size,
            d.size
        );

        ctx.restore();
    }

    ctx.globalAlpha = 1;
}


// --------------------------------------------------
// BACKGROUND
// --------------------------------------------------

function drawSky() {
    const gradient = ctx.createLinearGradient(
        0,
        0,
        0,
        H
    );

    gradient.addColorStop(0, "#030611");
    gradient.addColorStop(.55, "#081329");
    gradient.addColorStop(1, "#11182a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Moon
    ctx.beginPath();
    ctx.arc(
        W * .78,
        H * .18,
        42,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#fff8d7";
    ctx.fill();

    // subtle moon glow
    const moonGlow = ctx.createRadialGradient(
        W * .78,
        H * .18,
        35,
        W * .78,
        H * .18,
        100
    );

    moonGlow.addColorStop(
        0,
        "rgba(255,245,190,.15)"
    );

    moonGlow.addColorStop(
        1,
        "rgba(255,245,190,0)"
    );

    ctx.fillStyle = moonGlow;

    ctx.beginPath();
    ctx.arc(
        W * .78,
        H * .18,
        100,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// --------------------------------------------------
// SKYLINE
// --------------------------------------------------

function drawSkyline() {
    const baseY = H;

    for (const building of skyline) {
        const y = baseY - building.height;

        ctx.fillStyle = "#090d18";

        ctx.fillRect(
            building.x,
            y,
            building.width,
            building.height
        );

        for (const win of building.windows) {
            ctx.fillStyle = "#d6b64b";

            ctx.fillRect(
                building.x + win.x,
                y + win.y,
                6,
                9
            );
        }
    }
}


// --------------------------------------------------
// DRAW
// --------------------------------------------------

function draw() {
    ctx.save();

    // Screen shake ONLY.
    // No white screen flashing.
    if (shakePower > 0.1) {
        ctx.translate(
            (Math.random() - .5) * shakePower,
            (Math.random() - .5) * shakePower
        );
    }

    drawSky();
    drawSkyline();

    for (const b of buildings) {
        drawBuilding(b);
    }

    drawParticles();

    if (state === "playing") {
        drawHero();
    }

    if (state === "exploding") {
        drawExplosion();
    }

    ctx.restore();
}


// --------------------------------------------------
// MAIN LOOP
// --------------------------------------------------

let lastTime = performance.now();

function loop(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;

    dt = Math.min(dt, .035);

    if (state === "playing") {
        updateHero(dt);

        if (state === "playing") {
            updateBuildings(dt);
        }

        updateParticles(dt);
    }

    else if (state === "exploding") {
        updateExplosion(dt);
    }

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);


// --------------------------------------------------
// MENU
// --------------------------------------------------

function drawInitialMenu() {
    resetGame();
}

drawInitialMenu();

</script>
</body>
</html>
